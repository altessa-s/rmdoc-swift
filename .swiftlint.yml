# SwiftLint for RMDoc. Run it from the repository root: `swiftlint`.
#
# What this configuration is for: the mechanical mistakes a reader stops
# noticing — a force unwrap that takes the whole run down with a signal,
# `count == 0` where `isEmpty` was meant, a `%` that means `isMultiple(of:)`.
# What it is deliberately not for is the shape of the code. Those decisions
# this package has already made and written down in the comments above each
# one, and a linter repeating them at every build teaches nothing that review
# does not.
#
# Every number below was measured against this tree, and every rule that is
# off is off for a reason given on the spot. Fourteen files of sources and
# eleven of tests, the longest of them `ZipRecord.swift` at 209 lines and
# `StructureTests.swift` at 297.

excluded:
  - .build
  - .swiftpm
  - build
  - DerivedData
  # Generated by XcodeGen from project.yml for the framework build, and
  # ignored rather than committed. It holds no Swift of its own; it is named
  # here so a stray lint of a generated tree stays quiet.
  - RMDoc.xcodeproj

disabled_rules:
  # 7 occurrences, consistently, across Package.swift and the tests. That is
  # a house style, and the linter does not get a vote.
  - trailing_comma

  # Both fire on `ZipReader.record(at:in:directoryOffset:directoryEnd:)`, the
  # one function that reads a directory record and its local header. A zip entry has a
  # fixed list of fields and every one of them is a claim to be checked
  # before it is used, so the branches are the format's rather than the
  # function's — splitting it would put the bounds check in one place and the
  # read it guards in another, which is the arrangement these rules exist to
  # prevent.
  - function_body_length
  - cyclomatic_complexity

# Everything else the size-and-complexity family checks is measured and
# passing, so it stays on: `file_length` and `type_body_length` — both of
# which fired once, and both of which were answered by splitting the tests
# into a suite per subject rather than by raising a number — `nesting` and
# `function_parameter_count` (zero), `large_tuple` and `identifier_name` at
# their defaults (zero). None of them is configured here, because a threshold
# written down is a threshold someone will grow into.

opt_in_rules:
  # Rules that are off by default and earn their place here: each one names a
  # spelling that hides intent — a count compared to zero, a filter whose only
  # use is `isEmpty`, a `%` that means `isMultiple(of:)`.
  #
  # None of these fires today. They are guards, not clean-up: the point is that
  # the first one to fire is new work, and is looked at.
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  # Zero force unwraps in the package today, product code and tests alike, and
  # that is the state worth keeping. Tests are not exempt: a `!` there ends the
  # whole run with a signal, so the case that failed is the one thing the
  # output does not name.
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unowned_variable_capture
  - yoda_condition

# Prose is exempt — the long explanations above declarations are the point of
# this package, and wrapping them to a column would only make them worse. What
# is left is code, and code at 240 columns is not read, it is scrolled past.
# The ceiling is 150: the longest line in the tree today is 113 columns, so
# the number is a bound on what may be added rather than a description of
# what is there.
line_length:
  warning: 150
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
